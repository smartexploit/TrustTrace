```
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">TrustTrace</div>
        <div class="subtitle">Product QR Code Manager</div>
    </div>
</header>

<main>

    <section class="intro">
        <h1>Product QR Codes</h1>
        <p>
            Generate a TrustTrace verification QR code for every registered product.
        </p>
    </section>

    <div id="message" class="message"></div>

    <section id="products" class="grid">
        <div class="loading">
            Loading registered products...
        </div>
    </section>

</main>

<script>
    const TOKEN_KEY = "trusttrace_token";

    const productsContainer =
        document.getElementById("products");

    const message =
        document.getElementById("message");


    function getToken() {
        return localStorage.getItem(TOKEN_KEY);
    }


    function showMessage(text, type) {
        message.textContent = text;
        message.className = `message ${type}`;
    }


    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function authHeaders() {
        const token = getToken();

        if (!token) {
            return {};
        }

        return {
            Authorization: `Bearer ${token}`
        };
    }


    async function getQrImage(productCode) {
        const code = encodeURIComponent(productCode);

        const response = await fetch(
            `/products/${code}/qr`,
            {
                headers: authHeaders()
            }
        );

        if (!response.ok) {
            throw new Error(
                `Unable to generate QR code for ${productCode}.`
            );
        }

        const blob = await response.blob();

        return URL.createObjectURL(blob);
    }


    async function openQr(productCode) {
        try {
            const qrUrl = await getQrImage(productCode);

            window.open(
                qrUrl,
                "_blank",
                "noopener,noreferrer"
            );

        } catch (error) {
            showMessage(
                error.message,
                "error"
            );
        }
    }


    async function downloadQr(productCode) {
        try {
            const qrUrl = await getQrImage(productCode);

            const link = document.createElement("a");

            link.href = qrUrl;
            link.download =
                `${productCode}-trusttrace-qr.png`;

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => {
                URL.revokeObjectURL(qrUrl);
            }, 1000);

        } catch (error) {
            showMessage(
                error.message,
                "error"
            );
        }
    }


    async function renderProducts(products) {

        if (!products.length) {
            productsContainer.innerHTML =
                '<div class="empty">No registered products found.</div>';

            return;
        }

        productsContainer.innerHTML = "";

        for (const product of products) {

            const card = document.createElement("article");

            card.className = "card";

            card.innerHTML = `
                <h2>
                    ${escapeHtml(product.product_name)}
                </h2>

                <div class="product-meta">
                    <strong>Code:</strong>
                    ${escapeHtml(product.code)}
                    <br>

                    <strong>Batch:</strong>
                    ${escapeHtml(product.batch_id)}
                </div>

                <div class="qr-box">
                    <div class="qr-placeholder">
                        Loading QR code...
                    </div>
                </div>

                <div class="actions">
                    <button
                        class="button primary open-qr"
                        type="button"
                    >
                        Open QR
                    </button>

                    <button
                        class="button secondary download-qr"
                        type="button"
                    >
                        Download QR
                    </button>
                </div>
            `;

            const qrBox =
                card.querySelector(".qr-box");

            const openButton =
                card.querySelector(".open-qr");

            const downloadButton =
                card.querySelector(".download-qr");


            openButton.addEventListener(
                "click",
                () => openQr(product.code)
            );


            downloadButton.addEventListener(
                "click",
                () => downloadQr(product.code)
            );


            try {

                const qrUrl =
                    await getQrImage(product.code);

                const image =
                    document.createElement("img");

                image.src = qrUrl;

                image.alt =
                    `TrustTrace QR code for ${product.code}`;

                image.loading = "lazy";

                qrBox.innerHTML = "";

                qrBox.appendChild(image);

            } catch (error) {

                qrBox.innerHTML = `
                    <div class="qr-placeholder">
                        Unable to generate QR code.
                    </div>
                `;
            }


            productsContainer.appendChild(card);
        }
    }


    async function loadProducts() {

        const token = getToken();

        if (!token) {
            window.location.href = "/login";
            return;
        }

        try {

            const response = await fetch(
                "/products/",
                {
                    headers: authHeaders()
                }
            );


            if (response.status === 401) {
                localStorage.removeItem(TOKEN_KEY);
                localStorage.removeItem("trusttrace_user");

                window.location.href = "/login";
                return;
            }


            if (!response.ok) {
                throw new Error(
                    "Unable to load registered products."
                );
            }


            const products =
                await response.json();

            await renderProducts(products);

        } catch (error) {

            productsContainer.innerHTML = "";

            showMessage(
                error.message,
                "error"
            );
        }
    }


    loadProducts();
</script>
